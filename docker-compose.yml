services:
  postgres:
    image: postgres:16-alpine
    container_name: petyar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: petyar
      POSTGRES_PASSWORD: petyar
      POSTGRES_DB: petyar
    ports:
      - '5432:5432'
    volumes:
      - petyar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petyar -d petyar']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: petyar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - petyar_minio:/data
    profiles:
      - storage

volumes:
  petyar_pg:
  petyar_minio:
